name: Deploy Helios-API
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: run truffleHog
        uses: trufflesecurity/trufflehog@main
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: .
  tests:
    name: tests
    runs-on: ${{ vars.RUNS_ON }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Tests
        run: mvn test
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [trufflehog, hadolint, tests]
    steps:
      - uses: actions/checkout@v4

      - name: trivy (scan de vulnerabilidades)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
         image-ref: helios-api:test
         severity: 'CRITICAL,HIGH'
         ignore-unfixed: true
         exit-code: '1'
      - name: logs do container em caso de falha
        if: failure()
        run: docker logs helios-api


